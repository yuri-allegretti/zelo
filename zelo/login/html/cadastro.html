<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro|Zelo</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!--h3 class="zelo_text">Z</h3-->
    <img class="logo" src="../../assets/logo2.png" alt="Logo Zelo">
    <div class="page-container">
        <h1 class="login-titulo">Cadastre-se:</h1>

        <div id="mensagem" class="mensagem oculto"></div>
        <div class="campos_texto">
            <h3>Nome:</h3>
            <input type="text" id="nome" placeholder="Nome">

            <h3>Sobrenome:</h3>
            <input type="text" id="sobrenome" placeholder="Sobrenome">

            <h3>Email:</h3>
            <input type="email" id="email" placeholder="Email">

            <h3>Data de Nascimento:</h3>
            <input type="date" id="data_nascimento">

            <h3>Senha:</h3>
            <input type="password" id="senha" placeholder="Mínimo 8 caracteres">
        </div>

        <button id="btn-cadastro">Criar Conta</button>
        <p class="alternate"><a href="login.html">Já tenho conta</a></p>
    </div>

    <script src="../js/cadastro.js"></script>
</body>
</html>
