<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login - Zelo</title>
    <link rel="stylesheet" href="../css/style.css?v=2.0">
</head>
<body>
    <img class="logo" src="../../assets/logo2.png" alt="Logo Zelo">
    <!--h3 class="zelo_text">Zelo.</h3-->
    <div id="mensagem" class="mensagem oculto"></div>
    <div class="page-container">
        <h1 class="login-titulo">Faça login:</h1>

        <h3>Email:</h3>
        <input type="email" id="email" placeholder="Email">

        <h3>Senha:</h3>
        <input type="password" id="senha" placeholder="Senha">

        <button id="btn-login">Entrar</button>
        <p><a href="cadastro.html">Ainda não tenho conta!</a></p>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
