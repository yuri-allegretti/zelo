<h1>Editar Perfil (HTML)</h1>

<div id="mensagem" class="mensagem oculto"></div>

<div>
        <h3>Nome:</h3>
        <input type="text" id="nome" placeholder="Nome" class="form-control">

        <h3>Sobrenome:</h3>
        <input type="text" id="sobrenome" placeholder="Sobrenome" class="form-control">

        <h3>Email:</h3>
        <input type="email" id="email" placeholder="Email" class="form-control">

        <h3>Data de Nascimento:</h3>
        <input type="date" id="data_nascimento" class="form-control">

        <h3>Senha:</h3>
        <input type="password" id="senha" placeholder="Mínimo 8 caracteres" class="form-control">

        <button id="btn-editar-user">Enviar</button>
</div>
<script src="editar_user.js"></script>
